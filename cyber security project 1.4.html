<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Secure Login System</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    h1 { color: #2c3e50; }
    form { margin-bottom: 20px; }
    input { margin: 5px; padding: 8px; }
    button { padding: 8px 12px; }
    #message { margin-top: 20px; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Secure Login System</h1>

  <!-- Registration Form -->
  <h2>Register</h2>
  <form id="registerForm">
    <input type="text" id="regUser" placeholder="Username" required><br>
    <input type="password" id="regPass" placeholder="Password" required><br>
    <button type="submit">Register</button>
  </form>

  <!-- Login Form -->
  <h2>Login</h2>
  <form id="loginForm">
    <input type="text" id="loginUser" placeholder="Username" required><br>
    <input type="password" id="loginPass" placeholder="Password" required><br>
    <button type="submit">Login</button>
  </form>

  <button onclick="logout()">Logout</button>

  <div id="message"></div>

  <script>
    // Simulated user database (in-memory)
    const users = {};

    // Simple hashing simulation (not secure, just demo)
    function fakeHash(password) {
      return btoa(password); // base64 encoding as placeholder
    }

    // Register
    document.getElementById("registerForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const user = document.getElementById("regUser").value;
      const pass = document.getElementById("regPass").value;

      if (users[user]) {
        document.getElementById("message").innerText = "⚠️ User already exists!";
      } else {
        users[user] = fakeHash(pass);
        document.getElementById("message").innerText = "✅ Registration successful!";
      }
    });

    // Login
    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const user = document.getElementById("loginUser").value;
      const pass = document.getElementById("loginPass").value;

      if (users[user] && users[user] === fakeHash(pass)) {
        sessionStorage.setItem("loggedInUser", user);
        document.getElementById("message").innerText = "✅ Login successful!";
      } else {
        document.getElementById("message").innerText = "❌ Invalid credentials!";
      }
    });

    // Logout
    function logout() {
      sessionStorage.removeItem("loggedInUser");
      document.getElementById("message").innerText = "👋 Logged out successfully!";
    }
  </script>
</body>
</html>
